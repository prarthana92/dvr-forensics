{% extends "base.html" %}
{% block title %}TraceX — Upload{% endblock %}
{% block page_title %}Upload Evidence{% endblock %}

{% block content %}
<p class="text-muted">Add new footage or files for acquisition. Each file is automatically hashed and logged on upload.</p>

<div class="card evidence-item-card p-4 mt-3">
    <h5>Upload File(s)</h5>
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="files" class="form-control mb-3" multiple>
        <button type="submit" class="btn btn-accent">Upload Files</button>
    </form>
</div>

<div class="card evidence-item-card p-4 mt-4">
    <h5>Upload Folder</h5>
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="files" class="form-control mb-3" webkitdirectory directory multiple>
        <button type="submit" class="btn btn-accent">Upload Folder</button>
    </form>
</div>
{% endblock %}
